<div class="d-flex flex-column min-vh-100 bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" routerLink="/home">
        <i class="bi bi-bicycle me-2"></i>Zomato
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" routerLink="/home" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/services" routerLinkActive="active">Services</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact Us</a></li>
          <li class="nav-item mt-2 mt-lg-0">
            <a class="btn btn-light text-danger fw-semibold px-4 rounded-pill" routerLink="/login">Login</a>
          </li>
          <li class="nav-item mt-2 mt-lg-0">
            <a class="btn btn-outline-light fw-semibold px-4 rounded-pill" routerLink="/signup">Sign up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-0 text-muted">&copy; 2026 Zomato. All rights reserved.</p>
    </div>
  </footer>
</div>
