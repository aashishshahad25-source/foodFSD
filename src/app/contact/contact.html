<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="fw-bold">Contact Us</h1>
      <p class="lead text-muted">We would love to hear from you.</p>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 p-md-5">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control" placeholder="Your name">
              </div>
              <div class="col-md-6">
                <label for="contactEmail" class="form-label">Email</label>
                <input id="contactEmail" type="email" class="form-control" placeholder="you@example.com">
              </div>
              <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="5" placeholder="How can we help?"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-danger rounded-pill px-4">Send message</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
